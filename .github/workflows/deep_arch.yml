name: Deep-TCN-Varianten
# Architektur-A/B (KEINE Sobol-HP-Suche): jeder Arm ist ein nativ-5-s-LOSO
# bei GETEILTER HP, damit nur die Architektur variiert. Sieben Arme
# (tcn6-Baseline + sechs Proben) x drei Seeds -> per-fold-CV je Arm als
# eindeutig benanntes Artefakt. Aggregation lokal: seed-mitteln je Fold,
# dann gepaarter Wilcoxon jeder Variante gegen tcn6 (src/evaluation/
# significance.py). Single-Config -> kein 5-h-Timeout-Risiko wie die
# pathologischen Sobol-Configs (deep_hp.yml, 2026-07-02).
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Arme als JSON-Array (tcn6 = Baseline, muss dabei sein)"
        default: '["tcn6","tcn6w32","tcn6se","tcn6ap","tcn6k5","tcn6wn","tcn8"]'
      seeds:
        description: "Seeds als JSON-Array"
        default: '[42,43,44]'
      win:
        description: "Input-Fenster in s (nativ; tcn6-Feld ~5 s)"
        default: "5"
      max_epochs:
        description: "Max Epochs (Early Stopping patience 10)"
        default: "80"
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(inputs.models) }}
        seed: ${{ fromJSON(inputs.seeds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: Daten
        env: { DATA_URL: "${{ secrets.SWEEP_DATA_URL }}" }
        # Why: der Hoster drosselt parallele Downloads teils mit einer
        # HTTP-200-Fehlerseite — curl -f greift nicht, erst der
        # Zip-Integritaetscheck erkennt das; daher Retry-Schleife mit
        # Start-Jitter + 8 Versuchen (identisch zu deep_hp.yml). Kein
        # actions/cache: Probandendaten gehoeren nicht in den oeffentlich
        # lesbaren Cache eines Public-Repos.
        run: |
          if [ -z "$DATA_URL" ]; then echo "::error::SWEEP_DATA_URL fehlt"; exit 1; fi
          sleep $((RANDOM % 60))
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsSL --retry 5 --retry-all-errors "$DATA_URL" -o sweep_data.zip \
              && unzip -tq sweep_data.zip >/dev/null 2>&1 && break
            echo "Download-Versuch $i defekt (Hoster-Throttle?) — warte ~$((i*30))s"
            rm -f sweep_data.zip
            if [ "$i" = 8 ]; then echo "::error::Daten-Download nach 8 Versuchen defekt"; exit 1; fi
            sleep $((i*30 + RANDOM % 30))
          done
          unzip -q sweep_data.zip
      - name: "LOSO ${{ matrix.model }} s${{ matrix.seed }}"
        # Why: explizites `shell: bash` aktiviert -o pipefail — sonst
        # verschluckt die tee-Pipe den Exit-Code eines Trainings-Crashs
        # (Lehre aus den Transformer-OOM-Jobs, deep_hp.yml). Matrix-/Input-
        # Werte laufen ueber env (nicht direkte ${{ }}-Interpolation), damit
        # ein boeser JSON-Eintrag nicht in die Shell injizieren kann.
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
          SEED: ${{ matrix.seed }}
          WIN: ${{ inputs.win }}
          MAX_EPOCHS: ${{ inputs.max_epochs }}
        run: |
          echo "### $MODEL s$SEED" >> "$GITHUB_STEP_SUMMARY"
          python -u -m src.training.deep --model "$MODEL" --pool legacy \
            --win "$WIN" --seed "$SEED" \
            --max-epochs "$MAX_EPOCHS" --patience 10 2>&1 | tee run.log
          tail -n 20 run.log >> "$GITHUB_STEP_SUMMARY"
          # deep_loso_legacy.csv ist per-fold + significance.py-kompatibel;
          # eindeutig umbenennen, damit merge-multiple beim Download nicht klobbert.
          cp models/deep_loso_legacy.csv "arch_${MODEL}_s${SEED}.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "deep-arch-${{ matrix.model }}-s${{ matrix.seed }}"
          path: "arch_${{ matrix.model }}_s${{ matrix.seed }}.csv"
          if-no-files-found: warn
